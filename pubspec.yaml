name: shuttle_bus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Stable compatible versions
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.3
  firebase_messaging: ^16.0.3

  # Notifications
  flutter_local_notifications: ^19.5.0

  # UI & Utilities
  intl: ^0.20.2
  table_calendar: ^3.1.2
  cupertino_icons: ^1.0.8

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  flutter_polyline_points: 2.1.0

  # QR & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

  # Payment
  flutter_stripe: ^12.0.2

  # Networking
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/pin_pickup.png
    - assets/map/pin_drop.png
    - assets/map/pin_driver.png
    - assets/map/car.png

